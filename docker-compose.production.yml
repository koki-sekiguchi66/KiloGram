services:
  db:
    image: postgres:16-alpine
    container_name: dishboard-db-prod
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - dishboard_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: dishboard-backend-prod
    expose:
      - "8000"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=dishboard_project.settings
      - DJANGO_ENV=production
      - DEBUG=0
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - AZURE_VISION_ENDPOINT=${AZURE_VISION_ENDPOINT}
      - AZURE_VISION_KEY=${AZURE_VISION_KEY}
      # OAuth のディスカバリ文書（RFC 8414 / 9728）を配信するのは backend なので、
      # backend 側にも MCP のリソース識別子が必要
      - MCP_RESOURCE_URL=${MCP_RESOURCE_URL}
      # 認可サーバの issuer。PWA と別サブドメインにする（ADR #26）
      - OAUTH2_ISSUER_URL=${OAUTH2_ISSUER_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - dishboard_network

  # Claude からの MCP 接続を受ける ASGI サーバ。
  # backend と同じイメージ（同じ target）を使い command だけ差し替える。
  # migrate は実行しない（実行主体は backend に一本化する）。
  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: dishboard-mcp-prod
    command: >
      python -m uvicorn mcp_server.asgi:application
      --host 0.0.0.0 --port 8001
      --workers 1
    # ホストには公開しない。nginx 経由でのみ到達させる
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=dishboard_project.settings.mcp
      - DJANGO_ENV=production
      - DEBUG=0
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - MCP_RESOURCE_URL=${MCP_RESOURCE_URL}
      - OAUTH2_ISSUER_URL=${OAUTH2_ISSUER_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - dishboard_network

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    image: dishboard-nginx-prod
    container_name: dishboard-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - mcp
    restart: always
    networks:
      - dishboard_network

volumes:
  postgres_data:
  static_files:
  media_files:
  certbot_certs:
  certbot_www:

networks:
  dishboard_network:
    driver: bridge
