upstream backend {
    server backend:8000;
}

upstream mcp {
    server mcp:8001;
}

server {
    listen 80;
    server_name <sub>.duckdns.org;

    # Let's Encrypt (HTTP-01 チャレンジ)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name <sub>.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/<sub>.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<sub>.duckdns.org/privkey.pem;

    client_max_body_size 20M;   # OCR 画像アップロード用

    # Gzip圧縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # セキュリティヘッダー
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # フロント（SPA）
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静的ファイルキャッシュ
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # APIエンドポイント
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # MCP エンドポイント（Claude からの接続）
    # ツール呼び出しの上限は Claude 側で300秒。それに合わせて読み取りを待つ。
    # Streamable HTTP はレスポンスを逐次返しうるのでバッファリングを切る
    location /mcp {
        proxy_pass http://mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # OAuth 認可・トークン・動的クライアント登録
    # Claude はトークンエンドポイントの応答を10秒しか待たない
    location /o/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # OAuth の認可画面が要求するログイン画面（SPA ではなく Django が返す）
    location /accounts/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ディスカバリ文書（RFC 8414 / RFC 9728）。
    # 仕様上ルート直下に無ければならないため、SPA の location / より
    # 長い前置一致としてここで backend に回す。
    # /.well-known/acme-challenge/ は :80 のサーバブロックにあり、
    # かつより長い前置一致なので、この設定に影響されない
    location /.well-known/oauth-authorization-server {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }

    location /.well-known/oauth-protected-resource {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Django 静的ファイル: whitenoise 委譲のため backend へプロキシ
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django管理サイト
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ヘルスチェック
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# OAuth 認可専用サブドメイン（ADR #26）。
# PWA を配信しているオリジンと同じドメインでログイン画面（/accounts/ /o/authorize/）を
# 開くと、Android が「インストール済み PWA へのリンク横取り」を発動し、スマホの
# Claude アプリからログイン画面に到達できない。OAuth 関連だけこちらへ分離する。
# MCP のリソース識別子（/mcp、PRM）は分離しない。移動が必要なのは
# 人間がブラウザで開く認可・ログイン画面だけである
server {
    listen 80;
    server_name <auth-sub>.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name <auth-sub>.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/<auth-sub>.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<auth-sub>.duckdns.org/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # OAuth 認可・トークン・動的クライアント登録
    location /o/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # OAuth の認可画面が要求するログイン画面
    location /accounts/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AS メタデータ（RFC 8414）。PRM（RFC 9728）は MCP リソース側のオリジンに
    # 残す（このサブドメインには置かない）
    location /.well-known/oauth-authorization-server {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }
}
